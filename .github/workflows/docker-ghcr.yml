name: Build & publish to GHCR

# 手动 + main 分支推送都会重新构建镜像，推到 ghcr.io/<owner>/<repo>。
# 这样任何装好 Docker 的机器都能直接 docker pull，不用先拿到 tar 再 load。
#
# 拉取（公开仓库的包，无需登录）：
#   docker pull ghcr.io/czm9919/new-api-hc44:latest
#
# 用 PAT 之外的内置 GITHUB_TOKEN 推送，不需要在仓库里配任何 secret。

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
    inputs:
      version:
        description: '覆盖镜像内版本号（默认读 VERSION 文件）'
        required: false
        type: string

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    name: Build & push (linux/amd64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tags & version
        id: meta
        run: |
          VER="${{ github.event.inputs.version }}"
          if [ -z "$VER" ]; then
            VER="$(cat VERSION)"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          SHORT="${GITHUB_SHA::7}"
          {
            echo "tags<<EOF"
            echo "${IMAGE}:latest"
            echo "${IMAGE}:hc44"
            echo "${IMAGE}:sha-${SHORT}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "building $VER -> ${IMAGE}:latest"

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.title=new-api-hc44
            org.opencontainers.image.description=New API 定制分支：QQ 绑定 + 抽奖门禁 + 官方价三源同步
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### 镜像已推送"
            echo ""
            echo '```'
            echo "docker pull ${IMAGE}:latest"
            echo "docker pull ${IMAGE}:hc44"
            echo '```'
            echo ""
            echo "版本：\`${{ steps.meta.outputs.version }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
