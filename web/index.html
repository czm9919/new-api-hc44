<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover 是 iOS 刘海屏的前置条件：没有它，样式里的
         env(safe-area-inset-*) 恒为 0，底部安全区适配全部失效。 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="google" content="notranslate" />

    <!-- Primary Meta Tags -->
    <title>New API</title>
    <meta name="title" content="New API" />
    <meta
      name="description"
      content="Unified AI API gateway and admin dashboard."
    />

    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- 默认 default（状态栏不透明、文字自动反色，浅色主题下也看得清）。
         深色主题由下面的内联脚本改成 black-translucent 做沉浸。
         black-translucent 会把状态栏文字固定成白色并让页面延伸到状态栏
         下方，浅色背景下时间和电量等于隐身，不能写死。 -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />

    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0b0b0f"
      media="(prefers-color-scheme: dark)"
    />
    <!-- Resolve the theme before first paint so the page never flashes light
         and one-shot detectors (e.g. Dark Reader) see the real theme.
         Keep in sync with ThemeProvider and THEME_STORAGE_KEYS.mode. -->
    <script>
      ;(function () {
        var theme = 'system'
        try {
          theme = localStorage.getItem('newapi:theme:v1:mode') || 'system'
        } catch (e) {}
        if (theme !== 'dark' && theme !== 'light') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        }
        document.documentElement.classList.add(theme)

        // iOS 主屏启动时读的就是这一刻的 meta：深色用沉浸式状态栏，
        // 浅色退回 default，避免白色状态栏文字压在白底上。
        var bar = document.querySelector(
          'meta[name="apple-mobile-web-app-status-bar-style"]'
        )
        if (bar) {
          bar.setAttribute(
            'content',
            theme === 'dark' ? 'black-translucent' : 'default'
          )
        }
      })()
    </script>
    <!--umami-->
    <!--Google Analytics-->
  </head>

  <body>
    <div id="root" translate="no" class="notranslate"></div>
  </body>
</html>
